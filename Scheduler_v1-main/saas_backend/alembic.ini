# alembic.ini — Alembic configuration for SCAS Backend
# Run migrations from the saas_backend/ directory:
#   cd saas_backend
#   alembic upgrade head

[alembic]
# Path to migration scripts (relative to this file's location)
script_location = migrations

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# SQLAlchemy connection URL — override with DATABASE_URL env var in production
# For SQLite (default dev):
sqlalchemy.url = sqlite:///./scas.db

# For PostgreSQL (production), set DATABASE_URL env var and comment out the line above:
# sqlalchemy.url = postgresql+psycopg2://user:pass@localhost/scas

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: scas_user
      POSTGRES_PASSWORD: scas_password
      POSTGRES_DB: scas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scas_user -d scas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./saas_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SCAS_DATABASE_URL=postgresql://scas_user:scas_password@db:5432/scas_db
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./saas_frontend
      dockerfile: Dockerfile
    ports:
      - "6767:6767"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
